<svg width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="Stylized balance scale: green FOR and red AGAINST weighed on gold pans">
    <defs>
      <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#17171f"/>
        <stop offset="1" stop-color="#0e0e13"/>
      </linearGradient>
      <linearGradient id="gold" x1="256" y1="104" x2="256" y2="420" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#eec984"/>
        <stop offset="0.55" stop-color="#d4a24a"/>
        <stop offset="1" stop-color="#a9782e"/>
      </linearGradient>
      <radialGradient id="for-dot" cx="0.35" cy="0.3" r="0.9">
        <stop offset="0" stop-color="#5fce97"/>
        <stop offset="1" stop-color="#1d5c41"/>
      </radialGradient>
      <radialGradient id="against-dot" cx="0.35" cy="0.3" r="0.9">
        <stop offset="0" stop-color="#d07860"/>
        <stop offset="1" stop-color="#7a2d22"/>
      </radialGradient>
      <radialGradient id="halo" cx="0.5" cy="0.4" r="0.6">
        <stop offset="0" stop-color="#d4a24a" stop-opacity="0.10"/>
        <stop offset="1" stop-color="#d4a24a" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- tile: layered depth -->
    <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#tile)"/>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#halo)"/>
    <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#d4a24a" stroke-opacity="0.26" stroke-width="2"/>
    <rect x="22" y="22" width="468" height="468" rx="89" fill="none" stroke="#d4a24a" stroke-opacity="0.08" stroke-width="1"/>

    <!-- ground shadow -->
    <ellipse cx="256" cy="424" rx="96" ry="11" fill="#000000" opacity="0.4"/>

    <!-- yoke finial: small diamond -->
    <path d="M256 100 L272 118 L256 136 L240 118 Z" fill="url(#gold)"/>

    <!-- post: gentle taper -->
    <path d="M248 130 L264 130 L270 392 L242 392 Z" fill="url(#gold)"/>

    <!-- beam with rounded caps -->
    <rect x="110" y="160" width="292" height="22" rx="11" fill="url(#gold)"/>
    <circle cx="118" cy="171" r="16" fill="url(#gold)"/>
    <circle cx="394" cy="171" r="16" fill="url(#gold)"/>
    <circle cx="256" cy="171" r="10" fill="#0e0e13" opacity="0.55"/>

    <!-- left pan: curved strings + bowl -->
    <g>
      <path d="M118 174 C 98 202 84 226 79 250" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M118 174 C 138 202 152 226 157 250" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M68 252 Q118 312 168 252 L164 252 Q118 300 72 252 Z" fill="#0e0e13"/>
      <path d="M68 252 Q118 308 168 252 Z" fill="url(#gold)"/>
      <path d="M76 254 Q118 300 160 254 Q138 268 118 268 Q98 268 76 254 Z" fill="#000000" opacity="0.18"/>
      <circle cx="118" cy="252" r="13" fill="url(#for-dot)"/>
    </g>

    <!-- right pan: mirrored -->
    <g>
      <path d="M394 174 C 374 202 360 226 355 250" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M394 174 C 414 202 428 226 433 250" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M344 252 Q394 312 444 252 L440 252 Q394 300 348 252 Z" fill="#0e0e13"/>
      <path d="M344 252 Q394 308 444 252 Z" fill="url(#gold)"/>
      <path d="M352 254 Q394 300 436 254 Q414 268 394 268 Q374 268 352 254 Z" fill="#000000" opacity="0.18"/>
      <circle cx="394" cy="252" r="13" fill="url(#against-dot)"/>
    </g>

    <!-- pedestal -->
    <rect x="188" y="388" width="136" height="16" rx="8" fill="url(#gold)"/>
    <rect x="204" y="380" width="104" height="10" rx="5" fill="url(#gold)" opacity="0.85"/>
  </svg>
